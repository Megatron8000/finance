server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: finance-app

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_db}
    username: ${DB_USERNAME:finance_user}
    password: ${DB_PASSWORD:finance_password}

  jpa:
    hibernate:
      ddl-auto: validate # ❗ ВАЖНО: при Liquibase всегда validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# =====================
# JWT CONFIG
# =====================
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_TO_32+_CHARS_SECRET_KEY_FOR_HS256}
  validity-ms: 86400000 # 24 часа

# =====================
# LOGGING
# =====================
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
