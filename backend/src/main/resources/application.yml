server:
  port: 8080

spring:
  application:
    name: finance-app

  datasource:
    url: jdbc:postgresql://localhost:5432/finance_db

    username: admin
    password: 28031505
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
